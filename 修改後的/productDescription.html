<!DOCTYPE HTML>
<html>
<head>
<title>Product Description</title>
<link rel="stylesheet" href={{url_for('static', filename='css/productDescription.css')}} />
<link rel="stylesheet" href={{ url_for('static', filename='css/topStyle.css')}} />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap-grid.min.css" rel="stylesheet">
</head>
<body>
<div id="title">
	<a href="/">
		<i class="bi bi-book-fill fs-1" id="logo"></i>
	</a>
	
	{% if not loggedIn %}
	<div id="signInButton">
		<a class="link" href="/loginForm">會員登入</a>
	</div>
	{% else %}
	<div class="dropdown">
		<button class="dropbtn">會員中心<br>{{firstName}}</button>
		<div class="dropdown-content">
			<a href="/account/orders">會員訂單</a>
			<a href="/account/profile">會員資料</a>
			<hr>
			<a href="/logout">登出</a>
		</div>
	</div>
	{% endif %}
	<div id="kart">
		<a class="link" href="/cart">
			<i class="bi bi-cart-fill" id="cartIcon"></i>
			CART {{noOfItems}}
		</a>
	</div>
	<form>
		<input id="searchBox" type="text" name="searchQuery">
		<input id="searchButton" type="submit" value="Search">
	</form>
	<button id="aboutwe" type="button" onclick="location.href='/aboutwe'">關於我們</button>
</div>
<div class="displayCategory">
    <nav class="category-navbar">
        <ul class="category-nav">
            <li class="nav-title">商品種類：</li>
            {% for row in categoryData %}
            <li><a href="/displayCategory?categoryId={{row[0]}}">{{ row[1] }}</a></li>
            {% endfor %}
        </ul>
    </nav>
</div>
<div id="display">
	<div class="row">
    <div class="col-md-9">
		<div id="productName">
			<h1>{{data[1]}}</h1>
		</div>
		<div>
			<img src={{url_for('static', filename='uploads/'+data[4]) }} id="productImage"/>
		</div>

		<div id="productDescription">
			<h2>書本資料</h2>
			<table id="descriptionTable">
				<tr>
					<td>作者</td>
					<td>{{data[6]}}</td>
				</tr>
				<tr>
					<td>價格</td>
					<td>${{data[2]}}</td>
				</tr>
				<tr>
					<td>庫存</td>
					<td>{{data[5]}}</td>
				</tr>
			</table>	
		</div>
	</div>
	<div class="col-md-3">
		<div id="addToCart">
			<button onclick="location.href='/addToCart?productId={{ request.args.get('productId') }}'">
				放入<br>購物車
			</button>
		</div>
		<div id="BuyDirect">
			<form method="POST" action="/buyNow">
			<input type="hidden" name="productId" value="{{ request.args.get('productId') }}">
			<button type="submit">
				直接<br>購買
			</button>
		</form>
		</div>
	</div>
	<div id = "introducbook">
		<h2>簡介</h2>
		<p>{{data[3]}}</p>
	</div>
</div>
</div>
</body>
<footer id="footer">
        <p>&copy; 最終解釋權與所有權歸製作者所有</p>
    </footer>
</html>
