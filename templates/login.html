<!DOCTYPE HTML>
<html>
<head>
<title>	First flask app </title>
<link rel="stylesheet" href={{ url_for('static', filename='css/topStyle.css') }} />
<link rel="stylesheet" href={{ url_for('static', filename='css/login.css') }} />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap-grid.min.css" rel="stylesheet">
</head>
<body>
<div id="title">
	<a href="/">
		<i class="bi bi-book-fill fs-1 text-primary" id="logo"></i>
	</a>

	{% if not loggedIn %}
	<div id="signInButton">
		<a class="link" href="/loginForm">會員登入</a>
	</div>
	{% else %}
	<div class="dropdown">
		<button class="dropbtn">Hello, <br>{{firstName}}</button>
		<div class="dropdown-content">
			<a href="/account/orders">Your orders</a>
			<a href="/account/profile">Your profile</a>
			<hr>
			<a href="/logout">登出</a>
		</div>
	</div>
	{% endif %}
	<div id="kart">
		<a class="link" href="/cart">
			<i class="bi bi-cart-fill" id="cartIcon"></i>
			CART {{noOfItems}}
		</a>
	</div>
	<form>
		<input id="searchBox" type="text" name="searchQuery">
		<input id="searchButton" type="submit" value="Search">
	</form>
	<button id="aboutwe" type="button" onclick="location.href='/aboutwe'">關於我們</button>
</div>
<div class="row">
	<div class="col-md-7">
		<img src={{url_for('static', filename='images/remined.png')}} id="remined" />
	</div>
	<div class="col-md-5">
		<h1 id="UserLogInText">會員登入</h1>
		<hr>
		<p> {{error}} </p>
		<form action="/login" method="POST" id="login">
			<p><input type="text" name="email" placeholder="帳號"></p>
			<p><input type="password" name="password" placeholder="密碼"></p>
			<p><input type="submit" value="登入" id="loginButton"></p>
			<a href="/registerationForm">註冊</a>
		</form>
	</div>
</div>

</body>
	<footer id="footer">
        <p>&copy; 最終解釋權與所有權歸製作者所有</p>
    </footer>
</html>
