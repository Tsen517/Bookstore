<!DOCTYPE HTML>
<html>

<head>
	<title>Edit Profile</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/editProfile.css') }}" />
	<link rel="stylesheet" href="{{ url_for('static', filename='css/topStyle.css') }}" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
	{% include 'navbar.html' %}
	<div class="container mt-5 mb-5">
		<div class="row justify-content-center">
			<div class="col-md-8 col-lg-6">
				<div class="card shadow">
					<div class="card-body">
						<h2 class="card-title text-center mb-4">編輯資料</h2>
						<hr>
						<form action="/updateProfile" method="POST">
							<div class="mb-3">
								<label class="form-label">Email</label>
								<input type="email" class="form-control" name="email" value="{{ profileData[1] }}"
									readonly>
							</div>
							<div class="mb-3">
								<label class="form-label">名字</label>
								<input type="text" class="form-control" name="firstName" value="{{ profileData[2] }}">
							</div>
							<div class="mb-3">
								<label class="form-label">姓氏</label>
								<input type="text" class="form-control" name="lastName" value="{{ profileData[3] }}">
							</div>
							<div class="mb-3">
								<label class="form-label">地址1</label>
								<input type="text" class="form-control" name="address1" value="{{ profileData[4] }}">
							</div>
							<div class="mb-3">
								<label class="form-label">地址2</label>
								<input type="text" class="form-control" name="address2" value="{{ profileData[5] }}">
							</div>
							<div class="mb-3">
								<label class="form-label">郵遞區號</label>
								<input type="text" class="form-control" name="zipcode" value="{{ profileData[6] }}">
							</div>
							<div class="mb-3">
								<label class="form-label">城市</label>
								<input type="text" class="form-control" name="city" value="{{ profileData[7] }}">
							</div>
							<div class="mb-3">
								<label class="form-label">州/省</label>
								<input type="text" class="form-control" name="state" value="{{ profileData[8] }}">
							</div>
							<div class="mb-3">
								<label class="form-label">國家</label>
								<input type="text" class="form-control" name="country" value="{{ profileData[9] }}">
							</div>
							<div class="mb-3">
								<label class="form-label">電話號碼</label>
								<input type="text" class="form-control" name="phone" value="{{ profileData[10] }}">
							</div>
							<div class="d-grid gap-2">
								<button type="submit" class="btn btn-primary">儲存</button>
								<a href="{{ url_for('viewProfile') }}" class="btn btn-secondary">返回</a>
							</div>
						</form>
					</div>
				</div>
				<footer id="footer" class="text-center mt-4">
					<p>&copy; 最終解釋權與所有權歸製作者所有</p>
				</footer>
			</div>
		</div>
	</div>
</body>

</html>
