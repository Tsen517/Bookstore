{% extends "admin.html" %}
{% block content %}
<h2>商品管理</h2>
<table>
    <tr>
        <th>商品名稱</th>
        <th>價格</th>
        <th>庫存</th>
        <th>操作</th>
    </tr>
    {% for row in data %}
    <tr>
        <td>{{ row[1] }}</td>
        <td>
            <form action="{{ url_for('updateProduct') }}" method="post" style="display:inline;">
                <input type="number" name="price" value="{{ row[2] }}" step="0.01" required>
                <input type="hidden" name="productId" value="{{ row[0] }}">
                <input type="number" name="stock" value="{{ row[5] }}" min="0" required>
                <input type="submit" value="更新">
            </form>
        </td>
        <td>
            <form action="{{ url_for('removeItem') }}" method="post" style="display:inline;">
                <input type="hidden" name="productId" value="{{ row[0] }}">
                <input type="submit" value="刪除" onclick="return confirm('確定要刪除此書籍嗎？');">
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
