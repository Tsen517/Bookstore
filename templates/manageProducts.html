<h2>商品管理</h2>
<table>
    <tr>
        <th>商品名稱</th>
        <th>價格</th>
        <th>庫存</th>
        <th>操作</th>
    </tr>
    {% for row in data %}
    <tr>
        <form action="{{ url_for('updateProduct') }}" method="post">
            <td>{{ row[1] }}</td>
            <td>
                <input type="number" name="price" value="{{ row[2] }}" step="0.01" required>
            </td>
            <td>
                <input type="number" name="stock" value="{{ row[5] }}" min="0" required>
            </td>
            <td>
                <input type="hidden" name="productId" value="{{ row[0] }}">
                <input type="submit" value="更新">
            </td>
        </form>
    </tr>
    {% endfor %}
</table>
