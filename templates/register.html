<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>註冊帳號</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
    <script type="text/javascript" src="{{ url_for('static', filename='js/validateForm.js') }}"></script>
</head>

<body>
    <div class="register-container">
        <h2>註冊帳號</h2>
        <form action="/register" method="POST" onsubmit="return validate()">
            <label for="email">電子郵件</label>
            <input type="email" id="email" name="email" required>

            <label for="password">密碼</label>
            <input type="password" id="password" name="password" required>

            <label for="cpassword">確認密碼</label>
            <input type="password" id="cpassword" name="cpassword" required>

            <label for="firstName">名字</label>
            <input type="text" id="firstName" name="firstName" required>

            <label for="lastName">姓氏</label>
            <input type="text" id="lastName" name="lastName" required>

            <label for="address1">地址1</label>
            <input type="text" id="address1" name="address1">

            <label for="address2">地址2</label>
            <input type="text" id="address2" name="address2">

            <label for="zipcode">郵遞區號</label>
            <input type="text" id="zipcode" name="zipcode">

            <label for="city">城市</label>
            <input type="text" id="city" name="city">

            <label for="state">州/省</label>
            <input type="text" id="state" name="state">

            <label for="country">國家</label>
            <input type="text" id="country" name="country">

            <label for="phone">電話</label>
            <input type="text" id="phone" name="phone">

            <button type="submit">註冊</button>
            <a href="/loginForm" class="login-link">已有帳號？登入</a>
        </form>
    </div>
</body>

</html>
